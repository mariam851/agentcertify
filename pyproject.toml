[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcertify"
version = "0.1.0"
authors = [
  { name = "Mariam Zakaria" }
]
description = "A Statistical Uncertainty & Conformal Risk Control Runtime Framework for LLM Agents"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
transformers = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentcertify*"]
